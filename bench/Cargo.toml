# CU bench only, never deployed: verifies one PARANOID request proof on-chain with the
# alt_bn128 syscalls, to measure what on-chain verification would cost.
[workspace]

[package]
name = "groth16-bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "=2.3.0"
groth16-solana = "=0.2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
