[package]
name = "paranoid"
version = "0.1.0"
description = "Anonymous prepaid AI access: a USDC vault, a Poseidon member tree and rate-limit-nullifier slashing"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "paranoid"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Local validator build only: epochs may last seconds so tests and the product lane run in real time.
localnet = []

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
solana-poseidon = "=2.2.4"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))', 'cfg(target_os, values("solana"))'] }
